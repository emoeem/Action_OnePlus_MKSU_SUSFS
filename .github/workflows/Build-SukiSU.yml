name: Build OnePlus_SukiSU Ultra All

on:
  workflow_dispatch:
    inputs:
      CPU:
        type: choice
        description: "SoC 分支"
        required: true
        default: sm8650
        options:
          - sm7550
          - sm7675
          - sm8450
          - sm8475
          - sm8550
          - sm8650
          - sm8750
          - sm8850

      FEIL:
        type: choice
        description: "OnePlus manifest"
        required: true
        default: oneplus_ace3_b
        options:
          - oneplus_ace3_b
          - oneplus_ace3_pro_b
          - oneplus_ace3_pro_v
          - oneplus_12_b
          - oneplus_12_v
          - oneplus_13r
          - oneplus_ace5
          - oneplus_pad2_b
          - oneplus_pad2_v

      CPUD:
        type: choice
        description: "CPU 代号"
        required: true
        default: kalama
        options:
          - crow
          - waipio
          - kalama
          - pineapple
          - sun
          - canoe

      ANDROID_VERSION:
        type: choice
        description: "Android 版本"
        required: true
        default: android14
        options:
          - android12
          - android13
          - android14
          - android15
          - android16

      KERNEL_VERSION:
        type: choice
        description: "Kernel 版本"
        required: true
        default: "5.15"
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"

      BUILD_METHOD:
        type: choice
        description: "构建方式"
        required: true
        default: gki
        options:
          - gki
          - perf

      SUSFS_CI:
        type: boolean
        description: "SUSFS 使用 CI 构建模块"
        required: true
        default: true

      VFS:
        type: boolean
        description: "启用 VFS Hook"
        required: true
        default: true

      KPM:
        type: boolean
        description: "启用 KPM"
        required: true
        default: true

      ZRAM:
        type: boolean
        description: "启用 ZRAM/LZ4KD"
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl python3 jq

      - name: Install repo tool
        run: |
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o repo
          chmod +x repo
          sudo mv repo /usr/local/bin/repo

      - name: Show inputs
        run: |
          echo "CPU=${{ github.event.inputs.CPU }}"
          echo "FEIL=${{ github.event.inputs.FEIL }}"
          echo "CPUD=${{ github.event.inputs.CPUD }}"
          echo "ANDROID=${{ github.event.inputs.ANDROID_VERSION }}"
          echo "KERNEL=${{ github.event.inputs.KERNEL_VERSION }}"
          echo "BUILD=${{ github.event.inputs.BUILD_METHOD }}"

      # ===== Repo Init & Sync =====
      - name: Initialize repo and sync
        run: |
          set -e
          mkdir -p kernel_workspace
          cd kernel_workspace

          # 校验 manifest 是否存在
          if ! curl -sf \
            https://raw.githubusercontent.com/OnePlusOSS/kernel_manifest/oneplus/${{ github.event.inputs.CPU }}/${{ github.event.inputs.FEIL }}.xml \
            > /dev/null; then
            echo "::error::Manifest not found"
            exit 1
          fi

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/${{ github.event.inputs.CPU }} \
            -m ${{ github.event.inputs.FEIL }}.xml \
            --depth=1 \
            --no-tags \
            --no-clone-bundle

          repo sync -c -j$(nproc) --force-sync --no-tags --no-clone-bundle

          for dir in kernel_platform/common kernel_platform/msm-kernel; do
            if [ -f "$dir/BUILD.bazel" ]; then
              sed -i '/"protected_exports_list"/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* || true
          done

      # ===== 去掉 -dirty =====
      - name: Remove -dirty suffix
        run: |
          cd kernel_workspace/kernel_platform
          for f in common/scripts/setlocalversion msm-kernel/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
          done

      # ===== KernelSU Ultra =====
      - name: Add SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin
          cd KernelSU
          KSUVER=$(expr $(git rev-list --count HEAD) + 10606)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV

      # ===== SUSFS =====
      - name: Apply SUSFS
        run: |
          cd kernel_workspace
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}
          cd kernel_platform/common
          cp ../../susfs4ksu/kernel_patches/*.patch ./
          patch -p1 < *.patch || true

      # ===== Build =====
      - name: Build kernel (Bazel)
        if: ${{ github.event.inputs.CPU == 'sm8650' || github.event.inputs.CPU == 'sm7675' }}
        run: |
          cd kernel_workspace
          ./kernel_platform/build_with_bazel.py -t ${{ github.event.inputs.CPUD }} gki

      # ===== AnyKernel3 =====
      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3
          cp kernel_workspace/kernel_platform/**/Image AnyKernel3/Image || exit 1

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ github.event.inputs.FEIL }}
          path: AnyKernel3/*
