name: Build OnePlus_SukiSU Ultra All

on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "SoC branch"
        required: true
        default: sm8650
        type: choice
        options:
          - sm7550
          - sm7675
          - sm8450
          - sm8475
          - sm8550
          - sm8650
          - sm8750
          - sm8850

      FEIL:
        description: "OnePlus manifest"
        required: true
        default: oneplus_ace3_b
        type: choice
        options:
          - oneplus_ace3_b
          - oneplus_ace3_pro_b
          - oneplus_ace3_pro_v
          - oneplus_12_b
          - oneplus_12_v
          - oneplus_13r
          - oneplus_ace5
          - oneplus_pad2_b
          - oneplus_pad2_v

      CPUD:
        description: "CPU code-name"
        required: true
        default: kalama
        type: choice
        options:
          - crow
          - waipio
          - kalama
          - pineapple
          - sun
          - canoe

      ANDROID_VERSION:
        description: "Android version"
        required: true
        default: android14
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16

      KERNEL_VERSION:
        description: "Kernel version"
        required: true
        default: "5.15"
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"

      BUILD_METHOD:
        description: "Build method"
        required: true
        default: gki
        type: choice
        options:
          - gki
          - perf

      SUSFS_CI:
        description: "SUSFS CI module"
        required: true
        default: true
        type: boolean

      VFS:
        description: "Enable VFS hook"
        required: true
        default: true
        type: boolean

      KPM:
        description: "Enable KPM"
        required: true
        default: true
        type: boolean

      ZRAM:
        description: "Enable ZRAM / LZ4KD"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 python3-pip jq build-essential flex bison libssl-dev libncurses-dev libelf-dev ccache

      - name: Install repo tool
        run: |
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          chmod +x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo

      - name: Show inputs
        run: |
          echo "CPU=${{ github.event.inputs.CPU }}"
          echo "FEIL=${{ github.event.inputs.FEIL }}"
          echo "CPUD=${{ github.event.inputs.CPUD }}"
          echo "ANDROID=${{ github.event.inputs.ANDROID_VERSION }}"
          echo "KERNEL=${{ github.event.inputs.KERNEL_VERSION }}"
          echo "BUILD=${{ github.event.inputs.BUILD_METHOD }}"

      # ===== Repo Init & Sync =====
      - name: Initialize repo and sync
        run: |
          set -e
          mkdir -p kernel_workspace && cd kernel_workspace

          MANIFEST_URL="https://raw.githubusercontent.com/OnePlusOSS/kernel_manifest/oneplus/${{ github.event.inputs.CPU }}/${{ github.event.inputs.FEIL }}.xml"
          echo "Checking manifest: $MANIFEST_URL"
          curl -sf "$MANIFEST_URL" -o /dev/null || {
            echo "::error::Manifest not found: $MANIFEST_URL"
            exit 1
          }

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/${{ github.event.inputs.CPU }} \
            -m ${{ github.event.inputs.FEIL }}.xml \
            --depth=1 --no-tags --no-clone-bundle

          repo sync -c -j$(nproc) --force-sync --no-tags --no-clone-bundle

          for dir in kernel_platform/common kernel_platform/msm-kernel; do
            [ -f "$dir/BUILD.bazel" ] && sed -i '/"protected_exports_list"/d' "$dir/BUILD.bazel"
            rm -f "$dir/android/abi_gki_protected_exports_"* || true
          done

      # ===== Remove -dirty =====
      - name: Remove -dirty suffix
        run: |
          cd kernel_workspace/kernel_platform
          for f in common/scripts/setlocalversion msm-kernel/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i 's/ -dirty//g' "$f"
          done

      # ===== KernelSU Ultra =====
      - name: Add SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin
          cd KernelSU
          KSUVER=$(expr $(git rev-list --count HEAD) + 10606)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV

      # ===== SUSFS =====
      - name: Apply SUSFS
        run: |
          cd kernel_workspace
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}
          cd kernel_platform/common
          for p in ../../susfs4ksu/kernel_patches/*.patch; do patch -p1 < "$p" || true; done

      # ===== Kconfig additions =====
      - name: Extra Kconfig
        run: |
          cd kernel_workspace/kernel_platform/common
          CONFIG=arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU=y"                                        >> "$CONFIG"
          echo "CONFIG_KSU_SUSFS=y"                                  >> "$CONFIG"
          [ "${{ github.event.inputs.KPM }}" = "true" ]       && echo "CONFIG_KPM=y" >> "$CONFIG"
          [ "${{ github.event.inputs.ZRAM }}" = "true" ]      && echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG"
          [ "${{ github.event.inputs.VFS }}" = "true" ]       && echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG"

      # ===== Build =====
      - name: Build kernel (Bazel)
        if: ${{ github.event.inputs.CPU == 'sm8650' || github.event.inputs.CPU == 'sm7675' }}
        run: |
          cd kernel_workspace
          ./kernel_platform/build_with_bazel.py -t ${{ github.event.inputs.CPUD }} ${{ github.event.inputs.BUILD_METHOD }}

      - name: Find Image
        id: find
        run: |
          cd kernel_workspace
          IMG=$(find . -type f -name Image -exec file {} \; | grep 'Linux kernel ARM64 boot' | head -n1 | awk -F: '{print $1}')
          [ -n "$IMG" ] || { echo "::error::Image not found"; exit 1; }
          echo "img=$IMG" >> $GITHUB_OUTPUT

      # ===== AnyKernel3 =====
      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          cp ${{ steps.find.outputs.img }} AnyKernel3/Image

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ github.event.inputs.FEIL }}
          path: AnyKernel3/*
